<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 62 1000 430" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 z" fill="#000"/>
    </marker>
    <marker id="b" markerWidth="9" markerHeight="7" refX="1" refY="3.5" orient="auto">
      <path d="M9,0 L0,3.5 L9,7 z" fill="#000"/>
    </marker>
  </defs>

  <rect width="1000" height="520" fill="#fff"/>

  <!-- ============ THIET BI ============ -->
  <rect x="30" y="120" width="250" height="270" fill="none" stroke="#000" stroke-width="2"/>
  <text x="155" y="147" text-anchor="middle" font-size="15" font-weight="bold">ESP32-C6 SuperMini</text>
  <text x="155" y="166" text-anchor="middle" font-size="12">Matter End Device</text>

  <rect x="48" y="182" width="214" height="34" fill="none" stroke="#000"/>
  <text x="155" y="197" text-anchor="middle" font-size="12" font-weight="bold">EP0  Root Node</text>
  <text x="155" y="211" text-anchor="middle" font-size="11">Operational Credentials</text>

  <rect x="48" y="224" width="214" height="34" fill="none" stroke="#000"/>
  <text x="155" y="239" text-anchor="middle" font-size="12" font-weight="bold">EP1  Extended Color Light</text>
  <text x="155" y="253" text-anchor="middle" font-size="11">LED WS2812 — GPIO8</text>

  <rect x="48" y="266" width="214" height="34" fill="none" stroke="#000"/>
  <text x="155" y="281" text-anchor="middle" font-size="12" font-weight="bold">EP2  Generic Switch</text>
  <text x="155" y="295" text-anchor="middle" font-size="11">nút nhấn — GPIO19</text>

  <line x1="48" y1="316" x2="262" y2="316" stroke="#000" stroke-dasharray="3 3"/>
  <text x="155" y="333" text-anchor="middle" font-size="11">3 LED chỉ báo · 3 nút · OLED I2C</text>
  <text x="155" y="362" text-anchor="middle" font-size="12" font-weight="bold">192.168.1.39</text>
  <text x="155" y="378" text-anchor="middle" font-size="11">IPv4 + IPv6 global</text>

  <!-- ============ ROUTER ============ -->
  <rect x="400" y="200" width="200" height="110" fill="none" stroke="#000" stroke-width="2"/>
  <text x="500" y="228" text-anchor="middle" font-size="15" font-weight="bold">Router</text>
  <text x="500" y="248" text-anchor="middle" font-size="12">FPT AX3000HV2</text>
  <line x1="418" y1="262" x2="582" y2="262" stroke="#000"/>
  <text x="500" y="280" text-anchor="middle" font-size="11">IPv6 · mDNS · không cách ly</text>
  <text x="500" y="298" text-anchor="middle" font-size="12" font-weight="bold">192.168.1.1</text>

  <!-- ============ CONTROLLER ============ -->
  <rect x="720" y="80" width="250" height="120" fill="none" stroke="#000" stroke-width="2"/>
  <text x="845" y="108" text-anchor="middle" font-size="15" font-weight="bold">Raspberry Pi 4</text>
  <text x="845" y="127" text-anchor="middle" font-size="12">Home Assistant OS</text>
  <text x="845" y="145" text-anchor="middle" font-size="12">Matter Server add-on</text>
  <line x1="738" y1="158" x2="952" y2="158" stroke="#000"/>
  <text x="845" y="177" text-anchor="middle" font-size="12" font-weight="bold">fabric 1</text>
  <text x="845" y="193" text-anchor="middle" font-size="11">192.168.1.196</text>

  <rect x="720" y="310" width="250" height="120" fill="none" stroke="#000" stroke-width="2"/>
  <text x="845" y="338" text-anchor="middle" font-size="15" font-weight="bold">Máy tính Ubuntu</text>
  <text x="845" y="357" text-anchor="middle" font-size="12">4 tiến trình chip-tool,</text>
  <text x="845" y="375" text-anchor="middle" font-size="12">mỗi tiến trình một kho khoá</text>
  <line x1="738" y1="388" x2="952" y2="388" stroke="#000"/>
  <text x="845" y="407" text-anchor="middle" font-size="12" font-weight="bold">fabric 2 – 5</text>
  <text x="845" y="423" text-anchor="middle" font-size="11">192.168.1.219</text>

  <!-- ============ LIEN KET ============ -->
  <line x1="280" y1="255" x2="400" y2="255" stroke="#000" stroke-width="2.5" marker-end="url(#a)" marker-start="url(#b)"/>
  <text x="340" y="243" text-anchor="middle" font-size="12" font-weight="bold">Wi-Fi 2,4 GHz</text>

  <line x1="600" y1="230" x2="720" y2="150" stroke="#000" stroke-width="1.5" marker-end="url(#a)" marker-start="url(#b)"/>
  <rect x="628" y="168" width="72" height="17" fill="#fff"/>
  <text x="664" y="181" text-anchor="middle" font-size="12">Ethernet</text>

  <line x1="600" y1="280" x2="720" y2="360" stroke="#000" stroke-width="1.5" marker-end="url(#a)" marker-start="url(#b)"/>
  <rect x="628" y="324" width="72" height="17" fill="#fff"/>
  <text x="664" y="337" text-anchor="middle" font-size="12">Ethernet</text>

  <!-- ============ MULTI-FABRIC ============ -->
  <path d="M720 190 C 560 470, 320 470, 155 400" fill="none" stroke="#000" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#a)"/>
  <path d="M720 420 C 600 480, 340 480, 160 400" fill="none" stroke="#000" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#a)"/>
  <rect x="196" y="459" width="488" height="18" fill="#fff"/>
  <text x="440" y="472" text-anchor="middle" font-size="12" font-weight="bold">5 fabric độc lập cùng tồn tại trên một thiết bị</text>
</svg>
